name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  python:
    runs-on: ubuntu-latest
    env:
      KNOWLEDGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trip_pilot_knowledge_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: trip_pilot_knowledge_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trip_pilot_knowledge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.4"
      - run: uv sync --frozen --extra dev
      - name: Validate official source registry
        run: uv run trip-agent-acquisition validate ../../knowledge/sources
      - name: Initialize pgvector extension
        run: >-
          uv run python -c "import psycopg;
          connection = psycopg.connect('${{ env.KNOWLEDGE_TEST_DATABASE_URL }}');
          connection.execute('CREATE EXTENSION IF NOT EXISTS vector');
          connection.commit(); connection.close()"
      - run: uv run ruff check .
      - name: Validate release tooling style
        run: uv run ruff check ../../scripts/validate_staging_env.py ../../scripts/tests
      - run: uv run pytest --cov=trip_agent.retrieval --cov=trip_agent.acquisition --cov-report=term --cov-fail-under=80
      - run: uv run pytest
      - name: Run PlanEvaluation benchmark
        run: uv run python benchmarks/run_plan_evaluation.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
          INTERNAL_DIAGNOSTICS_TOKEN: ci-only-diagnostics-token-at-least-32-bytes
        run: docker compose -f compose.prod.yaml config --quiet
      - name: Validate immutable image overrides
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
          INTERNAL_DIAGNOSTICS_TOKEN: ci-only-diagnostics-token-at-least-32-bytes
          POSTGRES_IMAGE: registry.invalid/postgres@sha256:1111111111111111111111111111111111111111111111111111111111111111
          REDIS_IMAGE: registry.invalid/redis@sha256:2222222222222222222222222222222222222222222222222222222222222222
          RABBITMQ_IMAGE: registry.invalid/rabbitmq@sha256:3333333333333333333333333333333333333333333333333333333333333333
          TRAVEL_SERVER_IMAGE: registry.invalid/travel-server@sha256:4444444444444444444444444444444444444444444444444444444444444444
          AGENT_SERVICE_IMAGE: registry.invalid/agent-service@sha256:5555555555555555555555555555555555555555555555555555555555555555
          WEB_IMAGE: registry.invalid/web@sha256:6666666666666666666666666666666666666666666666666666666666666666
          PROMETHEUS_IMAGE: registry.invalid/prometheus@sha256:7777777777777777777777777777777777777777777777777777777777777777
        run: |
          digest_images="$(docker compose -f compose.prod.yaml config --images)"
          test "$(printf '%s\n' "$digest_images" | wc -l)" -eq 9
          if printf '%s\n' "$digest_images" | grep -Ev '@sha256:[0-9a-f]{64}$'; then
            echo "A production service did not resolve to an immutable image digest"
            exit 1
          fi
      - name: Build production images
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
          INTERNAL_DIAGNOSTICS_TOKEN: ci-only-diagnostics-token-at-least-32-bytes
        run: docker compose -f compose.prod.yaml build postgres travel-server agent-service web prometheus
      - name: Smoke-test production Compose
        env:
          PROVIDER_MODE: DEMO_ONLY
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
          INTERNAL_DIAGNOSTICS_TOKEN: ci-only-diagnostics-token-at-least-32-bytes
        run: |
          docker compose -f compose.prod.yaml up -d --wait --wait-timeout 180
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8080/
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8080/api/health |
            python3 -c "import json, sys; payload = json.load(sys.stdin); assert payload.get('status') == 'UP' and payload.get('service') == 'travel-server'"
      - name: Tear down production Compose smoke stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
          INTERNAL_DIAGNOSTICS_TOKEN: ci-only-diagnostics-token-at-least-32-bytes
        run: docker compose -f compose.prod.yaml down -v --remove-orphans

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release tooling behavior
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate Markdown links
        run: python scripts/check_markdown_links.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject tracked secret files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$)' | grep -v '\.env\.example$'; then
            echo "Tracked secret-like file detected"
            exit 1
          fi
